<!-- ╔══════════════════════════════════════════════╗
     ║  NAVBAR                                     ║
     ╚══════════════════════════════════════════════╝ -->
<nav id="navbar">

  <!-- Лого -->
  <div class="nav-logo" onclick="gotoPage('movies')">
    <div class="logo-mark">N</div>
    <div class="logo-name">NABOO<span>SHY</span></div>
  </div>

  <!-- Таб цэс -->
  <div class="nav-tabs">
    <button class="nav-tab active" id="t-movies"  onclick="gotoPage('movies')">
      <span class="tab-icon">🎬</span>КИНО

      <span class="tab-icon">🔍</span>ХАЙХ

  </div>

  <!-- Хайлт -->
  <div class="nav-right">
    <div class="nav-search-wrap" onclick="gotoPage('search')">
      🔍
      <input id="navSearchInput"
             type="text"
             placeholder="Хайх..."
             oninput="doSearch(this.value)"
             onfocus="gotoPage('search')">
    </div>
  </div>
